<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arachnid Origins: The Spider's Journey</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0c0a08;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#0c0a08;image-rendering:auto;outline:none}
</style>

<body>
<canvas id="game" width="1280" height="720" tabindex="0"></canvas>
<script>
/* core.js */
/* ============================================================================
 * Arachnid Origins: The Spider's Journey  --  core.js
 * Engine core: registry, event bus, input, camera, utils, game loop, scenes.
 * Owned by: lead. Do NOT edit from module agents (report needed changes instead).
 * ========================================================================== */
(function () {
  'use strict';
  const root = (typeof window !== 'undefined') ? window : globalThis;
  const Game = root.Game = root.Game || {};

  // ---------------------------------------------------------------- constants
  const C = Game.C = {
    VERSION: '1.0.0',           // shown on the title and pause screens; keep in step with package.json (tools/build.js checks)
    VIEW_W: 1280, VIEW_H: 720,
    WORLD_W: 6400, WORLD_H: 3600,
    DAY_LENGTH: 300,            // seconds for a full day/night cycle
    // Game modes, chosen on the title screen (New Game) and remembered in Game.settings.mode. The first one is the default.
    //   brood:    siblings give their lives to revive you (1 sibling = 1 revive)
    //   survival: one life; siblings still warn you and huddle, but cannot save you
    MODES: [
      { id: 'brood',    name: 'Brood',    tag: 'Default', blurb: 'Your siblings have your back. If you would die, a sibling gives its life to bring you back: one sibling, one revive. They also warn you of predators and huddle in while you rest.', note: 'Up to 5 revives, fewer as siblings drift away.' },
      { id: 'survival', name: 'Survival', tag: 'Hard',    blurb: 'One life, no second chances. Your siblings still warn you of predators and huddle in while you rest, but they cannot save you. When you die, the journey is over.', note: 'No revives.' },
    ],
    // Playable spiders. The first one is the starter and is always available; the others are locked until Game.unlocks.unlock(id)
    // (the Widow Matriarch boss unlocks the Black Widow). A species is data: `mods` multiply the stage stats (see player.applyUpgrades),
    // `venom` makes bites poison prey, `nightStealth` multiplies how easily hunters notice you after dusk, `leg` stretches the legs.
    SPECIES: [
      { id: 'garden', name: 'Garden Spider', latin: 'Araneus diadematus', tag: 'Starter',
        blurb: 'A balanced orb-weaver, the spider you start as. Nothing special, nothing missing: a good all-rounder that learns every web.',
        perks: ['Balanced: no strengths, no weaknesses', 'Weaves every web type'], mods: {}, leg: 1 },
      { id: 'widow', name: 'Black Widow', latin: 'Latrodectus mactans', tag: 'Boss reward',
        blurb: 'A shy night hunter with a famous neurotoxin. Her bite poisons prey, her silk is strong and plentiful, and she hides well in the dark, but she is a little frail and slower on her feet.',
        perks: ['Neurotoxic bite: poison keeps working after the bite', '+35% bite damage, +25% silk', 'Hunters notice you 20% less at night', '-6% speed, -10% health'],
        mods: { bite: 1.35, silk: 1.25, speed: 0.94, hp: 0.9, venom: 0.5, nightStealth: 0.8 }, leg: 1.08,
        unlock: 'Defeat the Widow Matriarch in her lair deep in the Old Oak Bark. Grow to a sub-adult first.', boss: 'widow' },
    ],
    SPAWN: { x: 320, y: 1800 }, // hatch point (inside Leaf Litter)
    ZONES: [
      { id: 'litter', name: 'Leaf Litter',  x0: 0,    x1: 2400, y0: 0, y1: 3600, color: '#5a4327' },
      { id: 'bark',   name: 'Old Oak Bark', x0: 2400, x1: 4200, y0: 0, y1: 3600, color: '#4a3b30' },
      { id: 'garden', name: 'Flower Garden',x0: 4200, x1: 6400, y0: 0, y1: 3600, color: '#3d6b35' },
    ],
    // radius = world px; zoom = camera zoom (bigger spider -> lower zoom -> wider view)
    STAGES: [
      { id: 'hatchling', name: 'Hatchling',  radius: 5,  growthNeeded: 60,  speed: 95,  maxHp: 30,  maxSilk: 20,  silkRegen: 2.0, bite: 1,  zoom: 3.0, hungerRate: 0.55, thirstRate: 0.50, energyRate: 0.30, webs: [] },
      { id: 'spiderling',name: 'Spiderling', radius: 8,  growthNeeded: 140, speed: 115, maxHp: 50,  maxSilk: 60,  silkRegen: 2.5, bite: 2,  zoom: 2.4, hungerRate: 0.50, thirstRate: 0.45, energyRate: 0.28, webs: ['line'] },
      { id: 'juvenile',  name: 'Juvenile',   radius: 12, growthNeeded: 260, speed: 135, maxHp: 80,  maxSilk: 100, silkRegen: 3.0, bite: 4,  zoom: 1.9, hungerRate: 0.45, thirstRate: 0.40, energyRate: 0.26, webs: ['line', 'sheet', 'retreat'] },
      { id: 'subadult',  name: 'Sub-adult',  radius: 17, growthNeeded: 420, speed: 150, maxHp: 120, maxSilk: 150, silkRegen: 3.5, bite: 7,  zoom: 1.5, hungerRate: 0.42, thirstRate: 0.36, energyRate: 0.24, webs: ['line', 'sheet', 'retreat', 'orb'] },
      { id: 'adult',     name: 'Adult',      radius: 22, growthNeeded: 0,   speed: 160, maxHp: 160, maxSilk: 200, silkRegen: 4.0, bite: 10, zoom: 1.2, hungerRate: 0.40, thirstRate: 0.34, energyRate: 0.22, webs: ['line', 'sheet', 'retreat', 'orb'] },
    ],
    // key = hotbar key (Digit1..4); stage = minimum stage index that unlocks it
    WEB_TYPES: {
      line:    { key: 1, name: 'Dragline',      cost: 8,  stage: 1, desc: 'A single silk line: travel fast, snag small prey.' },
      sheet:   { key: 2, name: 'Sheet Web',     cost: 25, stage: 2, desc: 'A flat sheet that entangles walking prey.' },
      orb:     { key: 3, name: 'Orb Web',       cost: 45, stage: 3, desc: 'A classic spiral orb that catches flyers.' },
      retreat: { key: 4, name: 'Silk Retreat',  cost: 30, stage: 2, desc: 'A silk shelter: rest safely, hide from predators.' },
    },
    // Molt upgrades. Max level 3 each. Player module applies the effects.
    UPGRADES: [
      { id: 'speed',      name: 'Swift Legs',      desc: '+8% move speed per level.',                     max: 3 },
      { id: 'silk',       name: 'Silk Glands',     desc: '+25% silk capacity and regen per level.',       max: 3 },
      { id: 'camo',       name: 'Camouflage',      desc: 'Predators notice you 20% less per level.',      max: 3 },
      { id: 'venom',      name: 'Potent Venom',    desc: '+25% bite damage per level.',                   max: 3 },
      { id: 'carapace',   name: 'Tough Cuticle',   desc: '+20% max health, -10% damage taken per level.', max: 3 },
      { id: 'vibration',  name: 'Vibration Sense', desc: 'Sense nearby creatures through the dark (+110 px radius per level).', max: 3 },
      { id: 'metabolism', name: 'Efficient Metabolism', desc: '-15% hunger and thirst drain per level.', max: 3 },
    ],
    // Every sfx name that may be emitted via Game.emit('sfx', {name, x, y, vol}).
    SFX: ['step', 'sprint', 'bite', 'eat', 'drink', 'spin', 'web_place', 'web_snap', 'trap', 'struggle',
          'hurt', 'death', 'molt_start', 'molt_end', 'levelup', 'ui_click', 'ui_hover', 'ui_back', 'unlock',
          'danger', 'splash', 'thunder', 'wasp_buzz', 'bird_screech', 'ant_hiss', 'rest', 'courtship', 'egg', 'victory', 'revive',
          'boss_roar', 'web_spit', 'slam'],
    KEYMAP: {
      up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
      sprint: ['ShiftLeft', 'ShiftRight'], spin: ['Space'], bite: ['KeyJ'], interact: ['KeyE'], rest: ['KeyR'],
      web1: ['Digit1'], web2: ['Digit2'], web3: ['Digit3'], web4: ['Digit4'],
      map: ['KeyM'], codex: ['KeyB'], science: ['KeyF'], zoomOut: ['KeyZ'], guide: ['KeyH'],
      pause: ['Escape', 'KeyP'], confirm: ['Enter', 'Space'], back: ['Escape', 'Backspace'],
      menuUp: ['ArrowUp', 'KeyW'], menuDown: ['ArrowDown', 'KeyS'], menuLeft: ['ArrowLeft', 'KeyA'], menuRight: ['ArrowRight', 'KeyD'],
      tabNext: ['Tab', 'KeyE'], tabPrev: ['KeyQ'],
    },
  };

  // ------------------------------------------------------------------- utils
  const U = Game.util = {
    clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    smooth: (t) => t * t * (3 - 2 * t),
    approach: (v, target, step) => v < target ? Math.min(v + step, target) : Math.max(v - step, target),
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    angleTo: (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax),
    wrapAngle: (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; },
    angleDiff: (a, b) => U.wrapAngle(b - a),
    turnToward: (a, target, maxStep) => { const d = U.angleDiff(a, target); return a + U.clamp(d, -maxStep, maxStep); },
    // seeded RNG (deterministic world gen): const r = mulberry32(123); r() -> [0,1)
    mulberry32: (seed) => { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
    chance: (p) => Math.random() < p,
    // deterministic value noise in [0,1]
    hash2: (x, y, seed) => { let h = (x * 374761393 + y * 668265263 + (seed || 0) * 1274126177) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; },
    noise2: (x, y, seed) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const s = (t) => t * t * (3 - 2 * t);
      const a = U.hash2(xi, yi, seed), b = U.hash2(xi + 1, yi, seed), c = U.hash2(xi, yi + 1, seed), d = U.hash2(xi + 1, yi + 1, seed);
      const u = s(xf), v = s(yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    },
    // distance from point to segment, and closest point {x,y,t}
    pointSeg: (px, py, x1, y1, x2, y2) => {
      const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
      let t = l2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / l2; t = t < 0 ? 0 : (t > 1 ? 1 : t);
      const x = x1 + dx * t, y = y1 + dy * t;
      return { x, y, t, d: Math.hypot(px - x, py - y) };
    },
    hexToRgb: (hex) => { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
    mixColor: (c1, c2, t) => { const a = U.hexToRgb(c1), b = U.hexToRgb(c2); return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')'; },
    rgba: (hex, a) => { const c = U.hexToRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; },
    // Create an offscreen canvas (works in browser and in the headless test harness).
    makeCanvas: (w, h) => { const c = (root.document && root.document.createElement) ? root.document.createElement('canvas') : null; if (c) { c.width = w; c.height = h; } return c; },
    inRect: (x, y, r) => x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1,
  };

  // --------------------------------------------------------------- event bus
  const listeners = {};
  Game.on = (evt, fn) => { (listeners[evt] || (listeners[evt] = [])).push(fn); return fn; };
  Game.off = (evt, fn) => { const l = listeners[evt]; if (!l) return; const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); };
  Game.emit = (evt, data) => {
    const l = listeners[evt]; if (!l) return;
    for (let i = 0; i < l.length; i++) { try { l[i](data, evt); } catch (e) { Game.reportError('event:' + evt, e); } }
  };

  // Errors never crash the loop; they are recorded (tests assert this list is empty).
  Game.errors = [];
  const seenErr = {};
  Game.reportError = (where, e) => {
    const key = where + '|' + (e && e.message);
    Game.errors.push({ where, message: e && e.message, stack: e && e.stack });
    if (!seenErr[key]) { seenErr[key] = 1; if (root.console) console.error('[Game] error in ' + where + ':', e); }
    if (Game.errors.length > 200) Game.errors.shift();
  };

  // --------------------------------------------------------------- settings/store
  const memStore = {};
  Game.store = {
    get(k, d) { try { const v = root.localStorage && root.localStorage.getItem('ao_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return k in memStore ? memStore[k] : d; } },
    set(k, v) { try { root.localStorage.setItem('ao_' + k, JSON.stringify(v)); } catch (e) { memStore[k] = v; } },
  };
  Game.settings = Object.assign({ master: 0.8, music: 0.6, sfx: 0.9, muted: false, science: false, hints: true, screenShake: true, mouseAim: true, keyGuide: true, mode: 'brood', species: 'garden' }, Game.store.get('settings', {}));
  if (!C.MODES.some(m => m.id === Game.settings.mode)) Game.settings.mode = C.MODES[0].id;   // unknown / stale saved value
  Game.modeInfo = (id) => C.MODES.find(m => m.id === id) || C.MODES[0];
  Game.saveSettings = () => Game.store.set('settings', Game.settings);

  // Spiders you can play as. The starter (C.SPECIES[0]) is always available; the rest are unlocked by beating their boss and stay
  // unlocked between journeys (saved in the store, like Codex discoveries).
  //   Game.unlocks.has(id)      is this species available?        Game.unlocks.list()  ids of every available species
  //   Game.unlocks.unlock(id)   unlock it -> true if it was new (emits `species:unlocked` {id}); unknown ids are ignored
  const speciesIds = () => C.SPECIES.map(s => s.id);
  const savedUnlocks = () => { const v = Game.store.get('unlocks', []); return Array.isArray(v) ? v.filter(id => speciesIds().indexOf(id) > 0) : []; };   // index 0 is the starter: never "locked"
  let unlockedSet = new Set(savedUnlocks());
  Game.speciesInfo = (id) => C.SPECIES.find(s => s.id === id) || C.SPECIES[0];
  Game.unlocks = {
    has: (id) => id === C.SPECIES[0].id || unlockedSet.has(id),
    list: () => C.SPECIES.filter(s => Game.unlocks.has(s.id)).map(s => s.id),
    unlock(id) {
      if (speciesIds().indexOf(id) < 0 || Game.unlocks.has(id)) return false;
      unlockedSet.add(id); Game.store.set('unlocks', Array.from(unlockedSet));
      Game.emit('species:unlocked', { id });
      return true;
    },
    reload() { unlockedSet = new Set(savedUnlocks()); },   // re-read the saved list (tests)
  };
  // the species a new game uses: the one asked for, else the one picked last, as long as it is unlocked; otherwise the starter
  Game.pickSpecies = (id) => { const s = Game.speciesInfo(id || Game.settings.species); return Game.unlocks.has(s.id) ? s.id : C.SPECIES[0].id; };
  if (!Game.unlocks.has(Game.settings.species)) Game.settings.species = C.SPECIES[0].id;   // stale saved choice

  // --------------------------------------------------------------- shared state
  // Modules own their own state (Game.player.x ...). Game.state only holds cross-cutting flags.
  Game.state = {
    scene: 'boot',    // boot|title|playing|paused|molting|codex|gameover|victory
    prevScene: null,
    danger: 0,        // 0..1 nearest-predator threat; written by creatures, read by audio/ui
    stats: {},        // free-form counters (eaten, webs, moltCount, daysSurvived...) written by anyone via Game.stat()
    victory: false,
    mode: 'brood',    // brood|survival: set by Game.newGame(mode)
    species: 'garden', // which spider you are (a Game.C.SPECIES id): set by Game.newGame(mode, species)
  };
  Game.stat = (k, add) => { const s = Game.state.stats; s[k] = (s[k] || 0) + (add === undefined ? 1 : add); return s[k]; };

  Game.time = { t: 0, real: 0, dt: 0, frame: 0 };  // t = sim seconds (only advances while playing), real = wall seconds (always)

  Game.setScene = (name) => {
    const from = Game.state.scene; if (from === name) return;
    Game.state.prevScene = from; Game.state.scene = name;
    Game.emit('scene:change', { from, to: name });
  };

  // ---------------------------------------------------------------- registry
  Game.modules = {};
  const modList = [];
  // Game.register('player', { priority, alwaysUpdate, init(), reset(), update(dt), ... })
  Game.register = (name, mod) => {
    mod.name = name; if (mod.priority == null) mod.priority = 50;
    Game.modules[name] = mod; Game[name] = mod;
    modList.push(mod); modList.sort((a, b) => a.priority - b.priority);
    return mod;
  };

  // Drawer layers (world space unless 'screen')
  Game.LAYER = { BACKGROUND: 0, GROUND: 10, RESOURCES: 20, SHELTER: 25, WEBS: 30, CREATURES_LOW: 40, PLAYER: 50, CREATURES_HIGH: 60, CANOPY: 70, WEATHER: 80, DARKNESS: 90, HUD: 100, MENU: 200, OVERLAY: 300 };
  const worldDrawers = [], screenDrawers = [];
  Game.addDrawer = (layer, fn, space) => {
    const list = space === 'screen' ? screenDrawers : worldDrawers;
    list.push({ layer, fn, order: list.length }); list.sort((a, b) => a.layer - b.layer || a.order - b.order);
  };
  Game.addScreenDrawer = (layer, fn) => Game.addDrawer(layer, fn, 'screen');

  // ------------------------------------------------------------------- input
  const keysDown = {}, keysPressed = {}, keysReleased = {};
  const mouse = { x: 640, y: 360, wx: 0, wy: 0, down: false, pressed: false, released: false, right: false, rightPressed: false, wheel: 0, moved: false };
  const codeToActions = {};
  Object.keys(C.KEYMAP).forEach(a => C.KEYMAP[a].forEach(k => (codeToActions[k] || (codeToActions[k] = [])).push(a)));
  const actionDown = (a) => { const ks = C.KEYMAP[a]; if (!ks) return false; for (let i = 0; i < ks.length; i++) if (keysDown[ks[i]]) return true; return false; };
  const actionEdge = (a, table) => { const ks = C.KEYMAP[a]; if (!ks) return false; for (let i = 0; i < ks.length; i++) if (table[ks[i]]) return true; return false; };
  Game.input = {
    mouse,
    down: (action) => actionDown(action) || (action === 'bite' && mouse.down),
    pressed: (action) => actionEdge(action, keysPressed) || (action === 'bite' && mouse.pressed),
    released: (action) => actionEdge(action, keysReleased) || (action === 'bite' && mouse.released),
    key: (code) => !!keysDown[code],
    keyPressed: (code) => !!keysPressed[code],
    // movement axis, each -1..1, normalized when diagonal
    axis: () => {
      let x = (actionDown('right') ? 1 : 0) - (actionDown('left') ? 1 : 0);
      let y = (actionDown('down') ? 1 : 0) - (actionDown('up') ? 1 : 0);
      if (x && y) { x *= Math.SQRT1_2; y *= Math.SQRT1_2; }
      return { x, y };
    },
    anyPressed: () => { for (const k in keysPressed) return true; return mouse.pressed; },
    // Tests may inject input:  Game.input.inject.keyDown('KeyW') / keyUp / click(x,y)
    inject: {
      keyDown: (code) => { if (!keysDown[code]) keysPressed[code] = true; keysDown[code] = true; Game.audioUnlock(); },
      keyUp: (code) => { keysDown[code] = false; keysReleased[code] = true; },
      click: (x, y) => { mouse.x = x; mouse.y = y; mouse.pressed = true; mouse.down = true; mouse.released = true; mouse.moved = true; Game.audioUnlock(); },
      clear: () => { for (const k in keysDown) keysDown[k] = false; },
    },
  };
  Game.audioUnlock = () => { if (Game.audio && Game.audio.unlock) { try { Game.audio.unlock(); } catch (e) { Game.reportError('audio.unlock', e); } } };

  // ------------------------------------------------------------------ camera
  const cam = Game.camera = {
    x: C.SPAWN.x, y: C.SPAWN.y, zoom: 3.0, targetZoom: 3.0,
    target: null,          // object with x,y ; default Game.player
    lerp: 6,               // follow speed
    shakeAmt: 0, shakeX: 0, shakeY: 0,
    view: { x0: 0, y0: 0, x1: 0, y1: 0 },  // visible world rect (updated each frame)
    zoomOutHeld: false,
    shake(amount) { if (Game.settings.screenShake) cam.shakeAmt = Math.max(cam.shakeAmt, amount); },
    snap() { const t = cam.target || Game.player; if (t) { cam.x = t.x; cam.y = t.y; } cam.zoom = cam.targetZoom; },
    worldToScreen(wx, wy) { return { x: (wx - cam.x) * cam.zoom + C.VIEW_W / 2, y: (wy - cam.y) * cam.zoom + C.VIEW_H / 2 }; },
    screenToWorld(sx, sy) { return { x: (sx - C.VIEW_W / 2) / cam.zoom + cam.x, y: (sy - C.VIEW_H / 2) / cam.zoom + cam.y }; },
    inView(x, y, pad) { pad = pad || 0; const v = cam.view; return x >= v.x0 - pad && x <= v.x1 + pad && y >= v.y0 - pad && y <= v.y1 + pad; },
  };
  function updateCamera(dt) {
    const t = cam.target || Game.player;
    if (t && typeof t.x === 'number') {
      const k = 1 - Math.exp(-cam.lerp * dt);
      cam.x += (t.x - cam.x) * k; cam.y += (t.y - cam.y) * k;
    }
    // stage zoom is set by player module via camera.targetZoom; hold Z to zoom out for perspective
    const zt = cam.targetZoom * (Game.input.down('zoomOut') && Game.state.scene === 'playing' ? 0.45 : 1);
    cam.zoom += (zt - cam.zoom) * (1 - Math.exp(-4 * dt));
    // clamp so the view stays inside the world
    const hw = C.VIEW_W / 2 / cam.zoom, hh = C.VIEW_H / 2 / cam.zoom;
    cam.x = U.clamp(cam.x, hw, Math.max(hw, C.WORLD_W - hw)); cam.y = U.clamp(cam.y, hh, Math.max(hh, C.WORLD_H - hh));
    if (cam.shakeAmt > 0.05) { cam.shakeX = (Math.random() - 0.5) * cam.shakeAmt; cam.shakeY = (Math.random() - 0.5) * cam.shakeAmt; cam.shakeAmt *= Math.exp(-9 * dt); } else { cam.shakeAmt = 0; cam.shakeX = cam.shakeY = 0; }
    cam.view.x0 = cam.x - hw; cam.view.x1 = cam.x + hw; cam.view.y0 = cam.y - hh; cam.view.y1 = cam.y + hh;
    const mw = cam.screenToWorld(mouse.x, mouse.y); mouse.wx = mw.x; mouse.wy = mw.y;
  }

  // ------------------------------------------------------------- game control
  // mode: a Game.C.MODES id; omitted = the one last chosen (Game.settings.mode, saved by the title screen)
  // species: a Game.C.SPECIES id that is unlocked; omitted, unknown or still locked = the one last chosen (Game.settings.species), else the starter
  Game.newGame = (mode, species) => {
    Game.state.mode = Game.modeInfo(mode || Game.settings.mode).id;
    Game.state.species = Game.pickSpecies(species);
    Game.state.victory = false; Game.state.danger = 0; Game.state.stats = {};

  function generate() {

      const sc = R(0.35, 0.9); addItem({ k: 'sprite', spr: SP.moss[floor(rn() * 4)], ppw: PPWK.moss, x, y, rot: R(0, TAU), sc, z: 0.8, a: 0.9, br: 160 * sc + 12 });

  // ------------------------------------------------------------------ shelters

  // ------------------------------------------------------------------- canopy

    }

  // ------------------------------------------------------------------ resources

    const fill = (type, xa, xb, cnt) => { let m = 0; for (let t = 0; t < cnt * 40 && m < cnt; t++) if (put(type, R(xa, xb), R(60, H - 60))) m++; };

  }

  // ------------------------------------------------------------ spawn hints
  function genSpawn(R, rn) {

  function geomSheet(w, rng) {

  function geomOrb(w, rng, ang) {

  // ------------------------------------------------------------ creature scan

    let n = 0;

  // ----------------------------------------------------------------- SHEET

  // --------------------------------------------------------------- RETREAT
  // scalloped tent outline: pegs on a ring, rim sags inward between pegs. pts: peg i radius = R*a[i]
  function tentRim(ctx, w, cx, cy, R, rot, scallop, from, to, move) {
    const np = w.nst, a = w.lm[0];
    for (let i = 0; i < np; i++) {

  function drawRetreat(ctx, w, A, integ, ghost, overlay) {

  // translucent canopy over the player when the player is inside a retreat (drawn above PLAYER layer)

  // ----------------------------------------------------- wraps, fx, ghost

  }
  function reviveUpdate(dt) {

  function setResting(on) {

  }

  // ---- growth ---------------------------------------------------------------------------------
  P.addGrowth = function (n) {
    n = num(n, 0); if (n <= 0 || this.dead) return;
    this.growth += n;
    Game.emit('growth:gain', { amount: n, total: this.growth, needed: this.growthNeeded });
    if (this.stage < 4 && this.growth >= this.growthNeeded && !this.molting) startMolt();
    else if (this.stage >= 4) this.growth = Math.min(this.growth, 999);
  };

  // ---- molting ----------------------------------------------------------------------------------
  P.offerUpgrades = function () {
    const ids = [];
    C.UPGRADES.forEach(u => { if ((this.upgrades[u.id] || 0) < u.max) ids.push(u.id); });
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = ids[i]; ids[i] = ids[j]; ids[j] = t; }
    return ids.slice(0, 3);
  };

  function startMolt() {

    P.molting = true; P.moltPhase = 'choose'; P.offers = P.offerUpgrades(); chooseWait = 0;
    pendingStage = P.stage + 1; swapped = false; moltT = 0;
    setResting(false); P.inShelter = null; P.vx = P.vy = 0; P.stateLabel = 'molting';
    P.invuln = Math.max(P.invuln, 0.2);
    Game.setScene('molting');

    Game.emit('molt:start', { stage: pendingStage, from: P.stage, offers: P.offers.slice() });
    sfx('molt_start', 1);
  }

  P.chooseUpgrade = function (id) {

    if (lvl >= def.max) return false;
    this.upgrades[id] = lvl + 1;
    this.applyUpgrades(true);

    this.moltPhase = 'anim'; moltT = 0; swapped = false;

  function doSwap() {

    P.silk = Math.min(P.maxSilk, P.silk + P.maxSilk * 0.5);
    P.energy = Math.max(P.energy, 60);

    Game.camera.targetZoom = P.stageInfo.zoom;
    stat('moltCount');

      addParticle('shard', P.x, P.y, Math.cos(a) * s, Math.sin(a) * s, 1.2 + Math.random() * 0.8, 0.5 + Math.random() * 0.9, '#f2e4c4', 0);
    }
    if (P.stage === 4) trySpawnMate();
  }

  function trySpawnMate() {
    const cr = Game.creatures;

  }

  function moltUpdate(dt) {
    moltT += dt;

    shiver = u < 0.5 ? 0.35 + u * 1.3 : Math.max(0.1, 0.9 - (u - 0.5) * 2);
    if (u >= 0.5 && !swapped) doSwap();
    if (swapped && u < 0.8) {   // new body slides forward out of the old skin
      const step = (P.radius * 2.0) / (0.3 * MOLT_T) * dt;
      moveBy(Math.cos(P.angle) * step, Math.sin(P.angle) * step);
    }
    if (Math.random() < dt * 14 && u > 0.2 && u < 0.85) {
      const a = Math.random() * TAU;
      addParticle('shard', P.x + Math.cos(a) * P.radius * 0.7, P.y + Math.sin(a) * P.radius * 0.7, Math.cos(a) * 8, Math.sin(a) * 8, 0.8, 0.4, '#fff3d8', 0);
    }
    if (u >= 1) {

      sfx('molt_end', 1);
    }
  }

  // scene === 'molting': waiting for the choice screen
  function chooseUpdate(dt) {
    chooseWait += dt;
    shiver = 0.3 + 0.08 * Math.sin(anim * 9);
    tickGait(dt, 0);

      if ((!Game.ui && chooseWait > 0.4) || chooseWait > 180) P.chooseUpgrade(P.offers[0] || (P.offerUpgrades()[0]));
    } else if (P.moltPhase === 'none') {   // safety: stuck in molting scene without a molt
      Game.setScene('playing');
    }
  }

  // ---- courtship & egg laying (adult ending) ----------------------------------------------------------
  function startCourt(m) {
    P.courting = true; courtT = 0; courtMateRef = m; setResting(false); P.inShelter = null;
    P.vx = P.vy = 0; P.stateLabel = 'courting'; sfx('courtship', 1);
  }
  function courtUpdate(dt) {
    const m = courtMateRef;

    courtT += dt;
    const d = Math.hypot(m.x - P.x, m.y - P.y), want = P.radius + (m.radius || 10) + 12;
    P.angle = U.turnToward(P.angle, Math.atan2(m.y - P.y, m.x - P.x), 6 * dt);
    if (d > want + 3) { const s = Math.min(70 * dt, d - want); moveBy((m.x - P.x) / d * s, (m.y - P.y) / d * s); }

      addParticle('heart', lerp(P.x, m.x, t), lerp(P.y, m.y, t) - 2, (Math.random() - 0.5) * 8, -14 - Math.random() * 10, 1.3, 1 + Math.random() * 0.8, Math.random() < 0.5 ? '#ffb7c9' : '#ffd98a', 0);
    }

      P.hunger = Math.max(0, P.hunger - 8);

  }
  function layUpdate(dt) {

      if (d > layTarget.r * 0.25) { const s = Math.min(50 * dt, d); moveBy((layTarget.x - P.x) / d * s, (layTarget.y - P.y) / d * s); }

  // ---- death ------------------------------------------------------------------------------------------------
  function deathUpdate(dt) {
    deathT += dt;

    moveBy(P.vx * dt, P.vy * dt);
    curl = Math.min(1.15, curl + dt * 1.1);
    tickGait(dt, 0);

  }

  // ---- movement ------------------------------------------------------------------------------------------------
  function moveBy(dx, dy) {
    const w = world();
    let nx = P.x + dx, ny = P.y + dy;
    if (has(w, 'resolve')) {
      let r = null;
      try { r = w.resolve(nx, ny, P.radius * 0.85); } catch (e) { r = null; }
      if (r && isFinite(r.x) && isFinite(r.y)) {
        const px = r.x - nx, py = r.y - ny, pl = Math.hypot(px, py);
        if (pl > 1e-4) {

          if (vn < 0) { P.vx -= vn * nxn; P.vy -= vn * nyn; }
        }
        nx = r.x; ny = r.y;
      }
    } else {
      nx = clamp(nx, P.radius, C.WORLD_W - P.radius); ny = clamp(ny, P.radius, C.WORLD_H - P.radius);
    }

  function updateRadius(dt) {
    const si = P.stageInfo;
    if (P.molting && !swapped) {
      const u = clamp(moltT / MOLT_T, 0, 1);
      P.radius = si.radius * (1 + 0.1 * smooth(Math.min(1, u / 0.45)));
    } else if (P.hatching) {
      P.radius = si.radius;
    } else {
      P.radius += (si.radius - P.radius) * (1 - Math.exp(-1.8 * dt));
    }
  }

  function steer(dt, ax, ay, sprint, aim) {
    const si = P.stageInfo, w = Game.webs;
    let spd = si.speed * P.speedMul, mod = 1;
    if (P.molting || P.moltTimer > 0) mod *= 0.5;
    if (exhaustedFlag) mod *= 0.62;
    if (P.tangleT > 0) mod *= P.tangleMul;
    if (P.hunger < 12) mod *= 0.9;
    if (has(w, 'speedBonusAt')) { try { mod *= clamp(num(w.speedBonusAt(P.x, P.y), 1), 1, 2.5); } catch (e) { /* ignore */ } }
    if (sprint) mod *= SPRINT_MUL;

    const hasIn = ax !== 0 || ay !== 0;

    if (aim != null) {

    }

    if (sp > 14) ta = Math.atan2(P.vy, P.vx); else if (hasIn) ta = Math.atan2(ay, ax); else ta = P.angle;
    if (sp > 14 || hasIn) P.angle = U.turnToward(P.angle, ta, (12 - P.stage * 1.1) * dt);
    moveBy(P.vx * dt, P.vy * dt);
    return sp;
  }

  // ---- biting ----------------------------------------------------------------------------------------------------------
  P.bite = function () {
    if (this.dead || this.reviving || this.molting || this.courting || this.laying || this.hatching || biteCd > 0) return false;
    const cr = Game.creatures, si = this.stageInfo;
    biteCd = Math.max(0.34, 0.58 - 0.05 * this.stage);
    bitePhase = 1;
    const reach = this.radius * 1.7 + 8;
    let cx = this.x + Math.cos(this.angle) * this.radius * 1.1, cy = this.y + Math.sin(this.angle) * this.radius * 1.1;
    let dmg = si.bite * this.biteMul, target = null, hitR = this.radius * 0.9 + 5;
    if (has(cr, 'nearest')) {
      try {
        target = cr.nearest(this.x, this.y, c => c && c.state !== 'dead' && c.hp > 0 && Math.hypot(c.x - P.x, c.y - P.y) - (c.radius || 3) <= reach, reach + 14);
      } catch (e) { target = null; }
    }
    if (target) {
      cx = target.x; cy = target.y; hitR = (target.radius || 3) + 3;
      this.angle = U.turnToward(this.angle, Math.atan2(target.y - this.y, target.x - this.x), 1.2);
      if (target.state === 'stuck') dmg *= 1.8;   // trapped prey is easy to subdue
    }
    let res = null;
    if (has(cr, 'attackAt')) { try { res = cr.attackAt(cx, cy, hitR, dmg, 'player'); } catch (e) { Game.reportError('player.bite', e); } }
    const hit = res && res.hit && res.hit.length;
    stat('bites');
    sfx('bite', hit ? 1 : 0.5);
    if (hit) { Game.camera.shake(1.2); for (let i = 0; i < 4; i++) addParticle('spark', cx, cy, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, 0.4, 0.6, '#ffe6b0', 0); }
    return true;
  };

  // ---- interaction --------------------------------------------------------------------------------------------------------
  function nearestShelter() {
    const w = world(); if (!w || !w.shelters) return null;
    let best = null, bd = 1e9; const lim = P.radius * 2.2;
    for (let i = 0; i < w.shelters.length; i++) {
      const s = w.shelters[i], d = Math.hypot(s.x - P.x, s.y - P.y) - s.r;
      if (d < lim && d < bd) { bd = d; best = s; }
    }
    return best;
  }

  function interact(dt) {
    const I = Game.input, w = world(), cr = Game.creatures;
    P.interactHint = '';
    const pressed = I.pressed('interact'), held = I.down('interact');
    // --- ending: mate and egg sac
    if (P.stage >= 4 && !P.mate.laid) {
      const m = cr && cr.mate;
      if (m && !P.mate.courted) {
        const d = Math.hypot(m.x - P.x, m.y - P.y);
        if (d < P.radius + (m.radius || 10) + 44) {
          P.mate.found = true;
          if (P.hunger > 35) { P.interactHint = 'E - Court the mate'; if (pressed) { startCourt(m); return; } }
          else P.interactHint = 'Too hungry to court - eat first';
          return;
        }
      } else if (P.mate.courted) {
        const site = findEggSite();
        if (site && Math.hypot(site.x - P.x, site.y - P.y) < site.r + P.radius * 1.2) {
          P.interactHint = 'E - Lay your egg sac'; if (pressed) { startLay(site); return; }
        }
      }
    }
    // --- drinking / sipping
    if (has(w, 'nearestResource')) {
      let res = null, kind = '';

        res = w.nearestResource(P.x, P.y, 'dew', P.radius + 18); kind = 'dew';
        if (!res || res.amount <= 0.05) { res = w.nearestResource(P.x, P.y, 'nectar', P.radius + 18); kind = 'nectar'; }
      } catch (e) { res = null; }
      if (res && res.amount > 0.05) {
        const full = kind === 'dew' ? P.hydration >= 99.5 : P.hunger >= 99.5;
        P.interactHint = full ? (kind === 'dew' ? 'Fully hydrated' : 'Not hungry') : (kind === 'dew' ? 'Hold E - Drink dew' : 'Hold E - Sip nectar');
        if (held && !full && P.speedNow() < 40) {
          const want = (kind === 'dew' ? 16 : 10) * dt;
          let took = want;
          if (has(w, 'consumeResource')) { try { took = num(w.consumeResource(res, want), 0); } catch (e) { took = 0; } }
          if (took > 0) {
            if (kind === 'dew') { P.hydration = clamp(P.hydration + took * 1.6, 0, 100); }
            else { P.hunger = clamp(P.hunger + took * 0.8, 0, 100); }
            drinkT = 0.25; drinkAcc += took * (kind === 'dew' ? 1.6 : 0.8);
            if (P.resting) setResting(false);
            if (Math.random() < dt * 14) addParticle('drop', res.x + (Math.random() - 0.5) * (res.r || 3), res.y + (Math.random() - 0.5) * (res.r || 3), (Math.random() - 0.5) * 6, -6 - Math.random() * 6, 0.5, 0.5, kind === 'dew' ? '#bfe8ff' : '#ffe08a', 0);
            P._drinkSfx = (P._drinkSfx || 0) - dt;
            if (P._drinkSfx <= 0) { sfx('drink', 0.8); P._drinkSfx = 0.32; }
            if (drinkAcc >= 4) { if (kind === 'dew') Game.emit('player:drank', { amount: drinkAcc }); stat('drinks'); drinkAcc = 0; }
          }
        }
        if (held) return;

    }
    // --- shelters
    const sh = nearestShelter();
    if (P.inShelter) {

    } else if (sh && exitCd <= 0) {

    }
  }
  P.speedNow = function () { return Math.hypot(this.vx, this.vy); };

  // ---- meters ---------------------------------------------------------------------------------------------------------------
  let exhaustT = 0;
  function meters(dt, moving, sprinting) {
    if (dt <= 0) return;
    const si = P.stageInfo, w = world();
    const sheltered = P.shelteredNow;
    const cr = Game.creatures, huddled = (P.resting && cr) ? num(cr.huddle, 0) : 0;
    P.huddled = huddled;
    const k = P.drainMul * (P.resting ? 0.5 * (1 - HUDDLE_DRAIN * huddled) : sprinting ? 1.8 : moving ? 1.15 : 1);
    P.hunger = clamp(P.hunger - si.hungerRate * k * dt, 0, 100);
    P.hydration = clamp(P.hydration - si.thirstRate * k * dt, 0, 100);
    // energy
    if (sprinting) P.energy -= SPRINT_DRAIN * dt;
    else if (P.hunger <= 0) P.energy -= si.energyRate * 2 * dt;       // starving: no recovery
    else if (P.resting) P.energy += REST_REGEN * (sheltered ? 3 : 1) * (1 + HUDDLE_ENERGY * huddled) * dt;
    else P.energy += ((moving ? 1.0 : 3.0) - si.energyRate) * dt;

    P.exhausted = exhaustedFlag;
    if (P.energy <= 0) exhaustT += dt; else exhaustT = Math.max(0, exhaustT - dt * 2);
    // consequences
    if (P.hunger <= 0) dot(P.maxHp * 0.03 * dt, 'starvation', dt);
    if (P.hydration <= 0) dot(P.maxHp * 0.035 * dt, 'dehydration', dt);
    if (exhaustT > 12) dot(P.maxHp * 0.02 * dt, 'exhaustion', dt);
    // rain on small, exposed spiders

    }
    const dark = tint(pal.legD, st, 0, st.shell ? 0.7 : 1), light = tint(pal.leg, st, 0.04, st.shell ? 0.55 : 1);
    const widths = [[1.55, 1.1], [1.15, 0.8], [0.72, 0.45]];
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? dark : light;
      for (let sgm = 0; sgm < 3; sgm++) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          if (sgm === 0) { ctx.moveTo(AX[i], AY[i]); ctx.lineTo(KX[i], KY[i]); }
          else if (sgm === 1) { ctx.moveTo(KX[i], KY[i]); ctx.lineTo(MX[i], MY[i]); }
          else { ctx.moveTo(MX[i], MY[i]); ctx.lineTo(FX[i], FY[i]); }
        }
        ctx.lineWidth = w * widths[sgm][pass];
        ctx.stroke();
      }
    }
    if (!st.shell) {
      // pale banding on the tibia and bright patella joints (more pronounced with stage)
      if (st.stage >= 2) {
        ctx.strokeStyle = tint(pal.mark, st, 0, 0.55); ctx.lineWidth = w * 0.7;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const x0 = KX[i] + (MX[i] - KX[i]) * 0.25, y0 = KY[i] + (MY[i] - KY[i]) * 0.25, x1 = KX[i] + (MX[i] - KX[i]) * 0.5, y1 = KY[i] + (MY[i] - KY[i]) * 0.5;
          ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
        }
        ctx.stroke();
        ctx.fillStyle = tint(pal.mark, st, 0.1, 0.5);
        ctx.beginPath();
        for (let i = 0; i < 8; i++) { ctx.moveTo(KX[i] + w * 0.55, KY[i]); ctx.arc(KX[i], KY[i], w * 0.55, 0, TAU); }
        ctx.fill();
      }
      // fine hairs (setae) on the leg segments
      ctx.strokeStyle = tint(pal.mark, st, 0.1, 0.38); ctx.lineWidth = Math.max(0.12, R * 0.022);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        for (let q = 0; q < 3; q++) {
          const t = 0.25 + q * 0.3, px = MX[i] + (KX[i] - MX[i]) * t * 1.2, py = MY[i] + (KY[i] - MY[i]) * t * 1.2;
          const ddx = FX[i] - KX[i], ddy = FY[i] - KY[i], dl = Math.hypot(ddx, ddy) || 1, nx = -ddy / dl, ny = ddx / dl, sg = (q & 1) ? 1 : -1;
          ctx.moveTo(px, py); ctx.lineTo(px + (nx * sg * 0.9 + ddx / dl * 0.5) * R * 0.2, py + (ny * sg * 0.9 + ddy / dl * 0.5) * R * 0.2);
        }
      }
      ctx.stroke();
    }
  }

  // body outlines (unit radius, local frame, +x forward)
  function cephPath(ctx) {
    ctx.beginPath();
    ctx.moveTo(0.9, 0);
    ctx.bezierCurveTo(0.92, -0.26, 0.66, -0.54, 0.26, -0.56);
    ctx.bezierCurveTo(-0.14, -0.58, -0.54, -0.44, -0.6, -0.1);
    ctx.lineTo(-0.6, 0.1);
    ctx.bezierCurveTo(-0.54, 0.44, -0.14, 0.58, 0.26, 0.56);
    ctx.bezierCurveTo(0.66, 0.54, 0.92, 0.26, 0.9, 0);
    ctx.closePath();
  }
  function abdPath(ctx) {   // origin at the pedicel, extends to -x
    ctx.beginPath();
    ctx.moveTo(-0.02, 0);
    ctx.bezierCurveTo(-0.05, -0.55, -0.45, -0.94, -0.92, -0.88);
    ctx.bezierCurveTo(-1.38, -0.82, -1.68, -0.4, -1.82, 0);
    ctx.bezierCurveTo(-1.68, 0.4, -1.38, 0.82, -0.92, 0.88);
    ctx.bezierCurveTo(-0.45, 0.94, -0.05, 0.55, -0.02, 0);
    ctx.closePath();
  }
  function eye(ctx, st, x, y, r, lx, ly, pal) {
    ctx.fillStyle = st.shell ? tint('#cbbd9c', st, 0, 0.8) : '#0b0b10';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    if (st.shell) return;
    ctx.strokeStyle = tint(st.stage >= 3 ? '#8a6a30' : '#4a4a58', st, 0, 0.55); ctx.lineWidth = r * 0.22;
    ctx.beginPath(); ctx.arc(x, y, r * 0.86, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(x + lx * r * 0.36, y + ly * r * 0.36, r * 0.27, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(190,225,255,0.35)';
    ctx.beginPath(); ctx.arc(x - lx * r * 0.25, y - ly * r * 0.25, r * 0.17, 0, TAU); ctx.fill();
  }

  // Black Widow abdomen markings (abdomen space). The young carry cream stripes and orange-red spots that fade as she molts; the adult is
  // glossy black with a red spot above the spinnerets. Her red hourglass is on the underside, so it only shows while she hangs belly-up
  // to spin or rest (st.belly).
  function widowMarks(ctx, st, pal, stg) {
    const stripeA = [0.5, 0.85, 0.7, 0.4, 0][stg], nSpots = [3, 4, 5, 3, 0][stg];
    if (stripeA > 0) {
      ctx.strokeStyle = tint(pal.mark, st, 0, stripeA); ctx.lineWidth = 0.09; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let j = 0; j < 3; j++) {   // curved stripes sweeping back from each flank
        const x0 = -0.35 - j * 0.38;
        ctx.moveTo(x0, -0.8 + j * 0.1); ctx.quadraticCurveTo(x0 - 0.32, -0.36, x0 - 0.12, -0.06);
        ctx.moveTo(x0, 0.8 - j * 0.1); ctx.quadraticCurveTo(x0 - 0.32, 0.36, x0 - 0.12, 0.06);
      }
      ctx.stroke();
    }
    if (nSpots) {
      ctx.fillStyle = tint(pal.spot, st, 0.05, 0.9);
      for (let j = 0; j < nSpots; j++) { ctx.beginPath(); ctx.arc(-0.5 - j * 0.28, 0, 0.085 - j * 0.006, 0, TAU); ctx.fill(); }
    }
    if (stg >= 3) {   // the red spot above the spinnerets
      const a = stg === 4 ? 1 : 0.55;
      ctx.fillStyle = tint(pal.spot, st, 0, a); ctx.beginPath(); ctx.ellipse(-1.52, 0, 0.18, 0.14, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = tint('#ff7a5c', st, 0, 0.35 * a); ctx.beginPath(); ctx.ellipse(-1.56, -0.04, 0.09, 0.05, 0, 0, TAU); ctx.fill();
    }
    if (stg >= 3 && st.belly > 0.02) {   // the hourglass: two triangles meeting at the waist
      ctx.fillStyle = tint(pal.spot, st, 0.05, 0.95 * st.belly * (stg === 4 ? 1 : 0.5));
      ctx.beginPath(); ctx.moveTo(-0.62, -0.3); ctx.lineTo(-0.62, 0.3); ctx.lineTo(-0.92, 0.035); ctx.lineTo(-1.22, 0.3); ctx.lineTo(-1.22, -0.3); ctx.lineTo(-0.92, -0.035); ctx.closePath(); ctx.fill();
    }
  }

  function drawBody(ctx, st, pal) {
    const stg = st.stage, mk = [0.35, 0.6, 0.75, 0.9, 1][stg], widow = st.species === 'widow';
    const lx = LIGHT.x * st.ca + LIGHT.y * st.sa, ly = -LIGHT.x * st.sa + LIGHT.y * st.ca;   // light direction in local space
    const breathe = 1 + 0.02 * Math.sin(st.t * (st.resting ? 1.6 : 2.6)) + (st.pulse || 0);
    const bite = st.bite, chew = st.eat > 0 ? Math.sin(st.t * 38) * 0.5 + 0.5 : 0;

    // pedipalps
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = tint(pal.cara, st, -0.1); ctx.lineWidth = 0.1;
    for (let s = -1; s <= 1; s += 2) {
      const wob = Math.sin(st.t * 7 + s) * 0.05 + (st.drink > 0 ? Math.sin(st.t * 22) * 0.07 : 0) + (st.dance ? Math.sin(st.t * 12 + s) * 0.18 : 0);
      ctx.beginPath(); ctx.moveTo(0.78, s * 0.2); ctx.lineTo(1.04, s * (0.4 + bite * 0.12) + wob * 0.5); ctx.lineTo(1.26 + bite * 0.06, s * (0.28 - bite * 0.04) + wob); ctx.stroke();
      ctx.fillStyle = tint(pal.dark, st, 0.1); ctx.beginPath(); ctx.arc(1.28 + bite * 0.06, s * (0.28 - bite * 0.04) + wob, 0.065, 0, TAU); ctx.fill();
    }
    // chelicerae and fangs
    const open = Math.max(bite, chew * 0.6);
    for (let s = -1; s <= 1; s += 2) {
      ctx.fillStyle = tint(pal.cara, st, -0.18);
      ctx.beginPath(); ctx.ellipse(0.93 + bite * 0.08, s * (0.12 + open * 0.07), 0.2, 0.115, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = st.venom ? tint('#6a1f14', st, 0) : tint('#2a1209', st, 0);
      ctx.lineWidth = 0.07;
      ctx.beginPath(); ctx.moveTo(1.04 + bite * 0.08, s * (0.11 + open * 0.07));
      ctx.quadraticCurveTo(1.18 + bite * 0.16, s * (0.1 + open * 0.26), 1.16 + bite * 0.26, s * (0.03 + open * 0.42)); ctx.stroke();
    }

    // abdomen
    ctx.save();
    const abd = ABD_SHAPE[st.species] || ABD_SHAPE.garden;
    ctx.translate(-0.5, 0); ctx.rotate(st.abAng); ctx.scale(0.86 * breathe * abd[0], 0.86 * breathe * abd[1]);
    let g = ctx.createRadialGradient(lx * 0.45, ly * 0.45 - 0.0, 0.05, -0.85, 0, 1.05);
    g.addColorStop(0, tint(pal.abd, st, 0.28)); g.addColorStop(0.5, tint(pal.abd, st, 0)); g.addColorStop(1, tint(pal.abd, st, -0.32));
    abdPath(ctx); ctx.fillStyle = g; ctx.fill();
    ctx.save(); abdPath(ctx); ctx.clip();
    if (!st.shell) {
      // markings: cardiac folium + chevrons + flank bands, bolder with each stage; camouflage adds mottling
      if (widow) widowMarks(ctx, st, pal, stg);
      else {
      ctx.fillStyle = tint(pal.mark, st, 0, 0.55 * mk);
      ctx.beginPath(); ctx.moveTo(-0.12, 0); ctx.quadraticCurveTo(-0.55, -0.26 - stg * 0.025, -1.0, -0.2 - stg * 0.02); ctx.quadraticCurveTo(-1.45, -0.1, -1.55, 0);
      ctx.quadraticCurveTo(-1.45, 0.1, -1.0, 0.2 + stg * 0.02); ctx.quadraticCurveTo(-0.55, 0.26 + stg * 0.025, -0.12, 0); ctx.fill();
      const nch = [0, 2, 3, 4, 5][stg];
      if (nch) {
        ctx.strokeStyle = tint(pal.mark, st, 0, 0.65 * mk); ctx.lineWidth = 0.06 + stg * 0.012;
        ctx.beginPath();
        for (let j = 0; j < nch; j++) {
          const x = -0.6 - j * 0.2, wj = 0.62 - j * 0.07;
          ctx.moveTo(x + 0.12, -wj); ctx.lineTo(x - 0.1, -0.05); ctx.lineTo(x + 0.12, wj); }
        ctx.stroke();
      }
      if (stg >= 2) {   // pale flank bands
        ctx.strokeStyle = tint(pal.mark, st, 0, 0.4 * mk); ctx.lineWidth = 0.1;
        ctx.beginPath(); ctx.moveTo(-0.2, -0.7); ctx.quadraticCurveTo(-0.9, -0.95, -1.5, -0.38); ctx.moveTo(-0.2, 0.7); ctx.quadraticCurveTo(-0.9, 0.95, -1.5, 0.38); ctx.stroke();
      }
      if (stg >= 4) {   // adult: golden crescents and dark spots
        ctx.strokeStyle = tint('#f2c25a', st, 0, 0.85); ctx.lineWidth = 0.12;
        ctx.beginPath(); ctx.arc(-0.35, 0, 0.62, Math.PI * 0.72, Math.PI * 1.28, false); ctx.stroke();
        ctx.beginPath(); ctx.arc(-0.35, 0, 0.62, -Math.PI * 0.28, Math.PI * 0.28, false); ctx.stroke();
        ctx.fillStyle = tint(pal.dark, st, 0, 0.8);
        for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.arc(-0.7 - j * 0.24, -0.38 + (j & 1) * 0, 0.045, 0, TAU); ctx.arc(-0.7 - j * 0.24, 0.38, 0.045, 0, TAU); ctx.fill(); }
      } else if (stg === 0) {
        ctx.fillStyle = tint(pal.dark, st, 0, 0.35);
        for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.arc(-0.7 - j * 0.22, (j & 1 ? 0.3 : -0.3), 0.05, 0, TAU); ctx.fill(); }
      }
      }
      if (st.camo > 0) {
        for (let j = 0; j < 9 + st.camo * 6; j++) {
          const px = -0.15 - hash(j, 1) * 1.5, py = (hash(j, 2) - 0.5) * 1.5, rr = 0.04 + hash(j, 3) * 0.07;
          ctx.fillStyle = hash(j, 4) > 0.5 ? 'rgba(30,22,14,0.32)' : 'rgba(235,225,200,0.3)';
          ctx.beginPath(); ctx.arc(px, py, rr, 0, TAU); ctx.fill();
        }
      }
    } else {   // shed skin: faint segmentation lines
      ctx.strokeStyle = 'rgba(120,100,70,0.35)'; ctx.lineWidth = 0.03;
      for (let j = 0; j < 5; j++) { ctx.beginPath(); ctx.arc(-0.9, 0, 0.35 + j * 0.15, 0, TAU); ctx.stroke(); }
    }
    // gloss
    if (!st.shell) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + 0.05 * (st.carapace || 0) + st.softness * 0.1 + (widow && stg >= 3 ? 0.1 * mk : 0)).toFixed(3) + ')';   // an adult widow is glossy
      ctx.beginPath(); ctx.ellipse(-0.75 + lx * 0.38, ly * 0.38, 0.42, 0.22, Math.atan2(ly, lx), 0, TAU); ctx.fill();
    }
    ctx.restore();
    abdPath(ctx); ctx.strokeStyle = tint(pal.dark, st, 0, 0.75); ctx.lineWidth = 0.05; ctx.stroke();
    // abdomen hairs and spinnerets
    if (!st.shell) {
      ctx.strokeStyle = tint(pal.mark, st, 0.1, 0.4); ctx.lineWidth = 0.022; ctx.beginPath();
      for (let j = 0; j < 22; j++) {
        const th = hash(j, 11) * TAU, px = -0.92 + Math.cos(th) * 0.9, py = Math.sin(th) * 0.86;
        if (px > -0.1) continue;
        const l = 0.1 + hash(j, 12) * 0.08; ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(th) * l, py + Math.sin(th) * l);
      }
      ctx.stroke();
      ctx.fillStyle = tint(pal.dark, st, 0.05); ctx.beginPath(); ctx.ellipse(-1.82, -0.07 - (st.silkUp || 0) * 0.02, 0.1, 0.045, 0, 0, TAU); ctx.ellipse(-1.82, 0.07, 0.1, 0.045, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // cephalothorax
    g = ctx.createRadialGradient(lx * 0.35 + 0.15, ly * 0.35, 0.05, 0.1, 0, 0.95);
    g.addColorStop(0, tint(pal.cara, st, 0.3)); g.addColorStop(0.55, tint(pal.cara, st, 0)); g.addColorStop(1, tint(pal.cara, st, -0.3));
    cephPath(ctx); ctx.fillStyle = g; ctx.fill();
    ctx.save(); cephPath(ctx); ctx.clip();
    if (!st.shell) {
      ctx.strokeStyle = tint(pal.mark, st, 0, (0.4 * mk + 0.1) * (widow && stg >= 3 ? 0.35 : 1)); ctx.lineWidth = 0.09; ctx.lineCap = 'round';
      if (stg >= 1) { ctx.beginPath(); ctx.moveTo(0.7, -0.2); ctx.quadraticCurveTo(0.1, -0.24, -0.45, -0.18); ctx.moveTo(0.7, 0.2); ctx.quadraticCurveTo(0.1, 0.24, -0.45, 0.18); ctx.stroke(); }
      ctx.strokeStyle = tint(pal.dark, st, 0, 0.55); ctx.lineWidth = 0.035;
      ctx.beginPath(); ctx.moveTo(-0.12, -0.07); ctx.lineTo(-0.28, 0); ctx.lineTo(-0.12, 0.07);   // thoracic fovea
      if (stg >= 2) { for (let s = -1; s <= 1; s += 2) for (let j = 0; j < 3; j++) { ctx.moveTo(-0.2, s * 0.05); ctx.lineTo(-0.1 + j * 0.22, s * (0.42 - j * 0.02)); } }
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.1 + 0.05 * (st.carapace || 0)).toFixed(3) + ')';
      ctx.beginPath(); ctx.ellipse(0.1 + lx * 0.3, ly * 0.3, 0.4, 0.2, Math.atan2(ly, lx), 0, TAU); ctx.fill();
      // cracking along the back during molting
      if (st.crack > 0) {
        const c = st.crack;
        ctx.fillStyle = tint('#fff6dc', st, 0, 0.95); ctx.beginPath();
        ctx.moveTo(0.66, 0); ctx.lineTo(0.25, -0.09 * c - 0.01); ctx.lineTo(-0.1, 0.08 * c + 0.01); ctx.lineTo(-0.55, -0.07 * c - 0.01);
        ctx.lineTo(-0.55, 0.07 * c + 0.01); ctx.lineTo(-0.1, -0.08 * c); ctx.lineTo(0.25, 0.09 * c + 0.01); ctx.closePath(); ctx.fill();
      }
    } else {   // the split down the back of the shed carapace
      ctx.fillStyle = 'rgba(70,52,32,0.55)'; ctx.beginPath();
      ctx.moveTo(0.62, 0); ctx.lineTo(0.25, -0.1); ctx.lineTo(-0.1, 0.08); ctx.lineTo(-0.5, -0.08); ctx.lineTo(-0.5, 0.08); ctx.lineTo(-0.1, -0.08); ctx.lineTo(0.25, 0.1); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    cephPath(ctx); ctx.strokeStyle = tint(pal.dark, st, 0, 0.8); ctx.lineWidth = 0.05; ctx.stroke();

    // eyes: two rows of four -> 8 eyes (AME, ALE, PME, PLE)
    for (let s = -1; s <= 1; s += 2) {
      eye(ctx, st, 0.76, s * 0.1, 0.07, lx, ly, pal);
      eye(ctx, st, 0.69, s * 0.23, 0.058, lx, ly, pal);
      eye(ctx, st, 0.5, s * 0.19, 0.105, lx, ly, pal);
      eye(ctx, st, 0.36, s * 0.31, 0.068, lx, ly, pal);
    }
    // carapace hairs
    if (!st.shell) {
      ctx.strokeStyle = tint(pal.mark, st, 0.15, 0.42); ctx.lineWidth = 0.022; ctx.beginPath();
      for (let j = 0; j < 20; j++) {
        const th = hash(j, 21) * TAU, px = 0.15 + Math.cos(th) * 0.74, py = Math.sin(th) * 0.55;
        const l = 0.08 + hash(j, 22) * 0.07; ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(th) * l, py + Math.sin(th) * l);
      }
      ctx.stroke();
    }
  }

  function drawSpider(ctx, st) {
    const R = st.r * st.scale * VS; if (R <= 0.01) return;
    const pal = (PALS[st.species] || PAL)[st.stage] || PAL[0];
    const ca = Math.cos(st.ang), sa = Math.sin(st.ang);
    st.ca = ca; st.sa = sa; st.camoK = (st.camo || 0) * 0.16; st.t = st.t || 0;
    const ox = ca * st.lunge * R - sa * st.bobLat * R, oy = sa * st.lunge * R + ca * st.bobLat * R;
    // soft contact shadow
    ctx.save();
    ctx.translate(st.x + R * 0.28 + ox * 0.4, st.y + R * 0.34 + oy * 0.4); ctx.rotate(st.ang); ctx.scale(R * 2.3, R * 1.55);
    const sg = ctx.createRadialGradient(-0.2, 0, 0.1, -0.2, 0, 1);
    const sh = (st.shell ? 0.1 : 0.3) * st.alpha;
    sg.addColorStop(0, 'rgba(0,0,0,' + sh.toFixed(3) + ')'); sg.addColorStop(0.6, 'rgba(0,0,0,' + (sh * 0.45).toFixed(3) + ')'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(-0.2, 0, 1, 0, TAU); ctx.fill();
    ctx.restore();
    // pale glow while the skin splits
    if (st.crack > 0 && !st.shell) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(st.x, st.y, 0, st.x, st.y, R * 3);
      gg.addColorStop(0, 'rgba(255,240,200,' + (0.35 * st.crack).toFixed(3) + ')'); gg.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(st.x, st.y, R * 3, 0, TAU); ctx.fill(); ctx.restore();
    }
    drawLegs(ctx, st, R, ca, sa, ox, oy, pal);
    ctx.save();
    ctx.translate(st.x + ox, st.y + oy); ctx.rotate(st.ang);
    ctx.scale(R * st.sx, R * st.sy);
    drawBody(ctx, st, pal);
    ctx.restore();
  }

  // ---- spinneret position / dragline trail ---------------------------------------------------------------------------
  const TAIL = { x: 0, y: 0 };
  function tailPos(o) {
    const R = P.radius * VS, a = P.angle, b = a + abAng;
    const px = P.x - Math.cos(a) * R * 0.5, py = P.y - Math.sin(a) * R * 0.5;
    o.x = px - Math.cos(b) * R * 1.55; o.y = py - Math.sin(b) * R * 1.55; return o;
  }
  function drawTrail(ctx) {
    if (trail.length < 1 || P.stage < 1 || P.dead) return;
    const R = P.radius, t = tailPos(TAIL), z = Game.camera.zoom || 1;
    const lw = Math.max(0.3, R * 0.045, 0.9 / z);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? 'rgba(255,250,235,0.1)' : 'rgba(255,252,240,0.42)';
      ctx.lineWidth = pass === 0 ? lw * 3.2 : lw;
      ctx.beginPath(); ctx.moveTo(t.x, t.y);
      for (let i = trail.length - 1; i >= 0; i--) { const p = trail[i]; ctx.lineTo(p.x + Math.sin(anim * 3 + i) * R * 0.03, p.y + Math.cos(anim * 2.6 + i) * R * 0.03); }
      ctx.stroke();
    }
  }

  // ---- hatching egg sac -----------------------------------------------------------------------------------------------------
  function pearl(ctx, R, alpha) {
    const g = ctx.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.1, 0, 0, R);
    g.addColorStop(0, 'rgba(255,252,240,' + alpha + ')'); g.addColorStop(0.65, 'rgba(240,228,198,' + (alpha * 0.9).toFixed(3) + ')'); g.addColorStop(1, 'rgba(206,188,150,' + (alpha * 0.8).toFixed(3) + ')');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();

  }
  function sacAge() { return (sac && sac.doneAt != null) ? Game.time.t - sac.doneAt : 0; }

    sg.addColorStop(0, 'rgba(0,0,0,0.25)'); sg.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.fillStyle = 'rgba(250,238,205,0.55)';

      ctx.beginPath(); ctx.moveTo(R * 0.2, 0);

  function drawSacFront(ctx) {

  }

  // ---- final egg sac (ending) ---------------------------------------------------------------------------------------------------
  function drawEggSac(ctx) {

    gg.addColorStop(0, 'rgba(255,236,190,' + (0.28 * t).toFixed(3) + ')'); gg.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(e.x, e.y, R * 2.6, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(250,236,200,0.6)';
    for (let j = 0; j < 9; j++) { const a = hash(j, 51) * TAU, d = R * (0.15 + hash(j, 52) * 0.6); ctx.beginPath(); ctx.arc(Math.cos(a) * d, Math.sin(a) * d, R * 0.09, 0, TAU); ctx.fill(); }

  // ---- shed skin ------------------------------------------------------------------------------------------------------------------------
  const XST = { species: 'garden', legK: 1, belly: 0, x: 0, y: 0, ang: 0, r: 5, scale: 1, stage: 0, feet: null, abAng: 0, softness: 0, flash: 0, alpha: 1, shell: true, camo: 0, carapace: 0, venom: false, deadK: 0, sx: 1, sy: 1, bobLat: 0, lunge: 0, bite: 0, eat: 0, drink: 0, resting: false, dance: false, pulse: 0, silkUp: 0, crack: 0, t: 0, camoK: 0 };
  function drawExuvia(ctx) {
    if (!exuvia) return;
    const e = exuvia, fade = clamp(1 - (e.t - 50) / 30, 0, 1); if (fade <= 0) return;
    XST.x = e.x; XST.y = e.y; XST.ang = e.ang; XST.r = e.r; XST.stage = e.stage; XST.species = e.species; XST.legK = e.legK; XST.feet = e.feet; XST.abAng = e.abAng * 0.5; XST.alpha = fade * 0.9; XST.t = anim;
    drawSpider(ctx, XST);
  }

  // ---- particles & hints ---------------------------------------------------------------------------------------------------------------------
  function drawParticles(ctx) {
    if (!parts.length) return;
    const k = 2.2 / (Game.camera.zoom || 1);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i], a = clamp(p.life / p.max, 0, 1), s = p.size * k;
      if (p.type === 'dust') {
        ctx.fillStyle = U.rgba(p.color, (a * 0.4).toFixed(3)); ctx.beginPath(); ctx.arc(p.x, p.y, s * (1.9 - a), 0, TAU); ctx.fill();
      } else if (p.type === 'spark' || p.type === 'drop') {
        ctx.save(); if (p.type === 'spark') ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = U.rgba(p.color, a.toFixed(3)); ctx.beginPath(); ctx.arc(p.x, p.y, s * (0.5 + a * 0.6), 0, TAU); ctx.fill(); ctx.restore();

        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.max * 7 + p.life * 5); ctx.fillStyle = U.rgba(p.color, (a * 0.9).toFixed(3));
        ctx.beginPath(); ctx.moveTo(-s, -s * 0.3); ctx.lineTo(s * 1.2, 0); ctx.lineTo(-s, s * 0.4); ctx.closePath(); ctx.fill(); ctx.restore();
      } else if (p.type === 'heart') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s * 0.9, s * 0.9); ctx.fillStyle = U.rgba(p.color, a.toFixed(3));

  // warm light around the spider as it gets back up (and a faint pulse while it is down waiting for the gift)

  function drawAll(ctx) {
    const sc = Game.state.scene; if (sc === 'boot') return;
    drawSac(ctx);
    drawEggSac(ctx);
    drawExuvia(ctx);
    drawTrail(ctx);
    drawReviveAura(ctx);
    drawSpider(ctx, playerState());
    drawTangle(ctx);
    drawSacFront(ctx);
    drawParticles(ctx);
    drawHint(ctx);
  }

  Game.register('player', P);
  try { P.reset(); } catch (e) { Game.reportError('player.reset(load)', e); }
})();

  // ---------------------------------------------------------------- prey
  def({
    id: 'springtail', name: 'Springtail', latin: 'Orchesella cincta (Collembola)', role: 'prey', tier: 0,
    sizeText: '1-3 mm', radius: 2.6, hp: 1.6, speed: 22, flee: 120, detection: 70, leash: 260,
    nocturnal: false, activity: 'any', fleeStyle: 'hop', graze: true, rainShelter: true, ext: 1.7, shadow: [1.5, 0.6],
    diet: ['fungal hyphae', 'decaying leaves', 'pollen'], habitat: ['litter', 'bark'],
    value: { hunger: 9, growth: 6 }, danger: 0, color: '#cfc9b0', color2: '#6e7a8a',
    trap: { time: 40, breaks: 0 },
    fact: 'Springtails are not true insects. They belong to Collembola, an ancient hexapod group whose mouthparts are tucked inside the head. A spring-loaded, forked tail (the furcula), held under the abdomen by a tiny catch, snaps down to fling the animal many body-lengths through the air in a fraction of a second. They are among the most abundant animals in leaf litter, recycling fungi and rotting leaves.',
    description: 'A tiny, soft-bodied grazer of the leaf litter. When startled it flicks its tail and vanishes in a hop. Easy first meal for a hatchling.',
  });
  def({
    id: 'mite', name: 'Oribatid Mite', latin: 'Platynothrus peltifer (Oribatida)', role: 'prey', tier: 0,
    sizeText: '0.5-1 mm', radius: 2.2, hp: 3, armor: 0.25, speed: 12, flee: 28, detection: 38, leash: 220,
    activity: 'any', graze: true, rainShelter: true, ext: 1.45, shadow: [1.1, 1.0],
    diet: ['fungi', 'decaying plant matter', 'lichen'], habitat: ['litter', 'bark'],

<script>

(function () {
  'use strict';

  const PHASE_AT = [0.6, 0.3];  // health fractions where phase 2 and 3 begin

  const ADULT_HP = 1.4;         // she sizes you up: an adult spider faces a Matriarch with this much more health

  // lunge: a locked, telegraphed dash. The lane is shown from the start of the windup, so sidestepping early dodges it.
  const LUNGE = { windup: 0.6, dash: 0.22, recover: 0.95, dmg: 16, minLen: 150, maxLen: 320, range: 200 };
  // silk spit: a fan of sticky globs. A hit hurts a little and slows; a miss leaves a sticky patch for a while.
  const SPIT = { windup: 0.5, recover: 0.55, speed: 330, life: 1.5, r: 6, dmg: 5, slow: 2.2, slowMul: 0.45, patchR: 26, patchLife: 4.5, patchSlow: 0.55, fan: [3, 3, 5], spread: 0.3 };
  // slam (phase 2+): rears up, then pounds the ground in a ring. Outside the ring is safe. She is stunned afterwards.
  const SLAM = { windup: 0.95, radius: 125, dmg: 24, stun: 1.7 };

  // ---- state ----------------------------------------------------------------
  const B = {
    priority: 45,
    state: 'gone', lair: null, c: null, phase: 1, introT: 0, tooSmall: false, discovered: false,
    mode: 'chase', atk: '', mt: 0, mdur: 1, cd: 1, stun: 0, strafe: 1, strafeT: 1, lastAtk: '', lostT: 0, hitDone: false,
    lockAng: 0, lockLen: 0, t: 0, deadT: 0, noticed: false,

  };
  const has = (o, f) => !!(o && typeof o[f] === 'function');
  function sfx(name, x, y, vol) { try { Game.emit('sfx', { name, x, y, vol: vol == null ? 1 : vol }); } catch (e) { /* ignore */ } }
  const P = () => Game.player || null;
  const bossSpecies = () => C.SPECIES.find(s => s.boss === 'widow') || null;
  const alive = (c) => !!(c && !c.dead && c.kind === 'widow');   // creature objects are recycled: never trust a stale reference

  B.active = () => B.state === 'intro' || B.state === 'fight';
  B.hpFrac = () => { const c = B.c; return alive(c) ? clamp(c.hp / c.maxHp, 0, 1) : (B.state === 'defeated' ? 0 : 1); };
  B.inArena = (x, y, pad) => !!B.lair && B.state !== 'gone' && hypot(x - B.lair.x, y - B.lair.y) < ARENA_R + (pad || 0);

  // ---- the lair --------------------------------------------------------------
  // The spot is chosen from the world as it was generated (deterministic): open ground in the bark zone, away from the hatch point and from

  function pickLair() {

    const midX = (z.x0 + z.x1) / 2;

    for (let x = z.x0 + 750; x <= z.x1 - 380; x += 90) {   // the heart of the bark: the litter (west) and the garden (east) blend in near the edges
      for (let y = 480; y <= C.WORLD_H - 480; y += 90) {

        if (has(w, 'exposure')) { try { for (let r = 0; r <= 280; r += 70) for (let k = 0; k < (r ? 8 : 1); k++) { const a = k * TAU / 8 + r; if (w.exposure(x + cos(a) * r, y + sin(a) * r) < 0.87) cover++; } } catch (e) { cover = 0; } }

  }
  function abs2(v) { return v < 0 ? -v : v; }

  // art: baked once per lair. core = the dense tangle and what she keeps in it (3x resolution); web = faint strands reaching out through the arena
  let artCore = null, artWeb = null, artKey = '';
  const CORE_R = 175, CORE_S = 2.2, WEB_R = 520;
  function bakeArt(lair) {
    const key = Math.round(lair.x) + ',' + Math.round(lair.y);
    if (artKey === key && artCore) return;
    artKey = key; artCore = artWeb = null;
    const rn = U.mulberry32((lair.x * 7 + lair.y * 13) | 0);
    const R = (a, b) => a + rn() * (b - a);
    try {
      const cs = Math.ceil(CORE_R * 2 * CORE_S);
      artCore = U.makeCanvas(cs, cs); const g = artCore && artCore.getContext('2d');
      if (g) {
        g.translate(cs / 2, cs / 2); g.scale(CORE_S, CORE_S);
        // the dark crevice

        gr.addColorStop(0, 'rgba(2,1,3,0.96)'); gr.addColorStop(0.6, 'rgba(8,4,8,0.82)'); gr.addColorStop(1, 'rgba(10,6,8,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, LAIR_R * 1.55, 0, TAU); g.fill();
        // thick anchor lines out to the edge, then the dense tangle
        g.lineCap = 'round';
        for (let i = 0; i < 16; i++) {
          const a = i * TAU / 16 + R(-0.1, 0.1), r1 = R(24, 40), r2 = R(120, CORE_R - 6), bend = R(-0.35, 0.35);
          g.strokeStyle = 'rgba(236,238,246,' + R(0.28, 0.5).toFixed(2) + ')'; g.lineWidth = R(0.9, 1.7);
          g.beginPath(); g.moveTo(cos(a) * r1, sin(a) * r1); g.quadraticCurveTo(cos(a + bend) * (r1 + r2) / 2, sin(a + bend) * (r1 + r2) / 2, cos(a) * r2, sin(a) * r2); g.stroke();
        }
        for (let i = 0; i < 90; i++) {
          const a1 = R(0, TAU), a2 = a1 + R(0.5, 2.6), r1 = R(36, CORE_R - 10), r2 = R(36, CORE_R - 10), am = (a1 + a2) / 2, rm = R(10, min(r1, r2));
          g.strokeStyle = 'rgba(232,236,246,' + R(0.14, 0.4).toFixed(2) + ')'; g.lineWidth = R(0.5, 1.2);
          g.beginPath(); g.moveTo(cos(a1) * r1, sin(a1) * r1); g.quadraticCurveTo(cos(am) * rm, sin(am) * rm, cos(a2) * r2, sin(a2) * r2); g.stroke();

          g.save(); g.translate(x, y); g.rotate(R(0, TAU));

          else if (k === 1) { g.fillStyle = 'rgba(210,222,236,0.35)'; g.beginPath(); g.ellipse(0, 0, R(7, 11), R(2.6, 4), 0, 0, TAU); g.fill(); g.strokeStyle = 'rgba(160,172,190,0.5)'; g.lineWidth = 0.5; g.beginPath(); g.moveTo(-8, 0); g.lineTo(8, 0); g.stroke(); }

          g.strokeStyle = 'rgba(255,255,255,0.45)'; g.lineWidth = 0.5; g.beginPath(); for (let j = 0; j < 5; j++) { const a1 = R(0, TAU); g.moveTo(x + cos(a1) * er * 0.95, y + sin(a1) * er * 0.95); g.lineTo(x + cos(a1 + 1.7) * er * 0.95, y + sin(a1 + 1.7) * er * 0.95); } g.stroke();

      }

      if (h) {   // faint strands reaching through the arena: the lair is the middle of a huge web she feels you through

    B.c = null; B.phase = 1; B.introT = 0; B.tooSmall = false; B.discovered = false; B.noticed = false;

    if (Game.camera && Game.camera.shake) Game.camera.shake(8);
    sfx('boss_roar', c && c.x, c && c.y, 0.8);
