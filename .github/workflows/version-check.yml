name: Version check

# Every PR that changes the game (src/, index.html, dist/) must raise the version and add a changelog entry:
#   node tools/bump.js <major|minor|patch> "what changed"
on:
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_version.js origin/${{ github.base_ref }}
      - run: npm ci
      - run: node tools/test_version.js
